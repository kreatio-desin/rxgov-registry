<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RxgovRegistry</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* Global Accessibility Styles */
      :root {
        --text-scale: 1;
      }

      html {
        font-size: calc(14px * var(--text-scale));
      }

      body {
        font-size: inherit;
      }

      /* Large text size - 110% scaling */
      html.text-size-large,
      body.text-size-large {
        --text-scale: 1.1;
      }

      html.text-size-large {
        font-size: calc(14px * 1.1);
      }

      /* Extra text size - 125% scaling */
      html.text-size-extra,
      body.text-size-extra {
        --text-scale: 1.25;
      }

      html.text-size-extra {
        font-size: calc(14px * 1.25);
      }

      /* Ensure all elements inherit font size by default */
      * {
        font-size: inherit;
      }

      /* Specific overrides for elements with hardcoded sizes */
      h1 {
        font-size: 2em;
      }

      h2 {
        font-size: 1.75em;
      }

      h3 {
        font-size: 1.5em;
      }

      h4 {
        font-size: 1.25em;
      }

      h5,
      h6 {
        font-size: 1em;
      }

      small {
        font-size: 0.875em;
      }

      /* Tables inherit from body */
      table,
      th,
      td {
        font-size: inherit;
      }

      /* Form elements */
      input,
      textarea,
      select,
      button {
        font-size: inherit;
      }

      /* Icons inherit font size */
      i,
      svg {
        font-size: inherit;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
