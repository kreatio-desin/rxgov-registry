<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RxgovRegistry</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet" crossorigin="anonymous" />
    <style>
      /* Bootstrap Icons Styling - Enhanced */
      .bi,
      i.bi,
      [class^="bi-"],
      [class*=" bi-"] {
        display: inline-block !important;
        font-family: 'bootstrap-icons' !important;
        font-style: normal;
        font-weight: normal;
        font-variant: normal;
        line-height: 1;
        vertical-align: -0.125em;
        text-transform: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Bootstrap Icons ::before rendering */
      .bi::before,
      i.bi::before {
        display: inline-block;
        content: '';
        font-family: 'bootstrap-icons' !important;
      }

      /* Specific icon mappings */
      .bi-layout-dashboard::before {
        content: '\f459';
      }

      .bi-bus::before {
        content: '\f1e2';
      }

      .bi-building-2::before {
        content: '\f8fa';
      }

      .bi-file-earmark-bar-graph::before {
        content: '\f623';
      }

      .bi-gear::before {
        content: '\f573';
      }

      .bi-circle-half::before {
        content: '\f432';
      }

      .bi-person-standing::before {
        content: '\f775';
      }

      .bi-people::before {
        content: '\f716';
      }

      .bi-arrow-repeat::before {
        content: '\f21c';
      }

      .bi-chevron-left::before {
        content: '\f284';
      }

      .bi-chevron-right::before {
        content: '\f285';
      }

      .bi-search::before {
        content: '\f906';
      }

      .bi-bell::before {
        content: '\f205';
      }

      .bi-life-preserver::before {
        content: '\f67c';
      }

      .bi-chevron-down::before {
        content: '\f282';
      }

      .bi-person::before {
        content: '\f6e8';
      }

      .bi-box-arrow-right::before {
        content: '\f343';
      }

      .bi-x::before {
        content: '\f62a';
      }

      .bi-check-circle::before {
        content: '\f2a3';
      }

      .bi-trash::before {
        content: '\f92b';
      }

      .bi-list::before {
        content: '\f67e';
      }

      /* Icons in buttons */
      button i.bi,
      button i[class^="bi-"],
      button i[class*=" bi-"] {
        display: inline-block;
        margin: 0;
        padding: 0;
        color: inherit;
        font-size: inherit;
      }

      /* Icons in links/anchors */
      a i.bi,
      a i[class^="bi-"],
      a i[class*=" bi-"] {
        display: inline-block;
        margin: 0;
        padding: 0;
        color: inherit;
        font-size: inherit;
        text-decoration: none;
      }

      /* Icons in labels */
      label i.bi,
      label i[class^="bi-"],
      label i[class*=" bi-"] {
        display: inline-block;
        margin: 0;
        padding: 0;
        color: inherit;
        font-size: inherit;
      }

      /* Ensure nav items with icons work properly */
      .nav-item i.bi {
        display: inline-block !important;
        color: inherit !important;
      }

      /* Global Accessibility Styles - MUST be in head before any component styles */

      /* Default base font size */
      html {
        font-size: 14px !important;
      }

      body {
        font-size: 14px !important;
      }

      /* Large text size - 110% scaling (15.4px) */
      html.text-size-large {
        font-size: 15.4px !important;
      }

      body.text-size-large {
        font-size: 15.4px !important;
      }

      /* Extra text size - 125% scaling (17.5px) */
      html.text-size-extra {
        font-size: 17.5px !important;
      }

      body.text-size-extra {
        font-size: 17.5px !important;
      }

      /* Force ALL descendants to inherit font-size */
      html.text-size-large * {
        font-size: inherit !important;
      }

      html.text-size-extra * {
        font-size: inherit !important;
      }

      body.text-size-large * {
        font-size: inherit !important;
      }

      body.text-size-extra * {
        font-size: inherit !important;
      }

      /* Also apply to all elements under app-root */
      html.text-size-large app-root *,
      html.text-size-large app-root *:not(style) {
        font-size: inherit !important;
      }

      html.text-size-extra app-root *,
      html.text-size-extra app-root *:not(style) {
        font-size: inherit !important;
      }

      /* Headings - scale proportionally using em */
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-size: 1em !important;
      }

      small {
        font-size: 0.875em !important;
      }

      /* Tables */
      table,
      th,
      td {
        font-size: inherit !important;
      }

      /* Form elements */
      input,
      textarea,
      select,
      button {
        font-size: inherit !important;
      }

      /* Buttons with text */
      .btn,
      [class*='btn'] {
        font-size: inherit !important;
      }

      /* All text and interactive elements */
      a,
      span,
      p,
      li,
      div,
      label,
      i,
      svg {
        font-size: inherit !important;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
