<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RxgovRegistry</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* Global Accessibility Styles */
      /* Large text size - 110% scaling */
      body.text-size-large {
        font-size: 15.4px;
      }

      body.text-size-large,
      body.text-size-large * {
        font-size: inherit;
      }

      body.text-size-large table,
      body.text-size-large .patients-table {
        font-size: 15.4px;
      }

      body.text-size-large table th,
      body.text-size-large .patients-table th {
        font-size: 13.2px;
      }

      body.text-size-large table td,
      body.text-size-large .patients-table td {
        font-size: 15.4px;
      }

      body.text-size-large .cell-rxid {
        font-size: 13.2px;
      }

      body.text-size-large .ssn-masked {
        font-size: 14.3px;
      }

      body.text-size-large .dose-info {
        font-size: 13.2px;
      }

      body.text-size-large .transfer-name {
        font-size: 15.4px;
      }

      body.text-size-large .transfer-from {
        font-size: 13.2px;
      }

      /* Extra text size - 125% scaling */
      body.text-size-extra {
        font-size: 17.5px;
      }

      body.text-size-extra,
      body.text-size-extra * {
        font-size: inherit;
      }

      body.text-size-extra table,
      body.text-size-extra .patients-table {
        font-size: 17.5px;
      }

      body.text-size-extra table th,
      body.text-size-extra .patients-table th {
        font-size: 15px;
      }

      body.text-size-extra table td,
      body.text-size-extra .patients-table td {
        font-size: 17.5px;
      }

      body.text-size-extra .cell-rxid {
        font-size: 15px;
      }

      body.text-size-extra .ssn-masked {
        font-size: 16.25px;
      }

      body.text-size-extra .dose-info {
        font-size: 15px;
      }

      body.text-size-extra .transfer-name {
        font-size: 15.75px;
      }

      body.text-size-extra .transfer-from {
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
