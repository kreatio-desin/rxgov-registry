<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RxgovRegistry</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* Global Accessibility Styles */
      :root {
        --text-scale: 1;
        font-size: 14px;
      }

      /* Apply scaling to all elements with font-size */
      * {
        --text-scale-value: calc(1em * var(--text-scale));
      }

      body {
        font-size: calc(14px * var(--text-scale));
      }

      /* Large text size - 110% scaling */
      body.text-size-large {
        --text-scale: 1.1;
      }

      /* Extra text size - 125% scaling */
      body.text-size-extra {
        --text-scale: 1.25;
      }

      /* Scale all text content */
      p, span, div, a, label, button, input, textarea, select, li, th, td {
        font-size: calc(1em * var(--text-scale));
      }

      /* Headings - scale with content */
      h1, h2, h3, h4, h5, h6 {
        font-size: calc(1em * var(--text-scale));
      }

      /* Icons and special elements */
      i, svg {
        font-size: inherit;
        width: calc(1em * var(--text-scale));
        height: calc(1em * var(--text-scale));
      }

      /* Tables */
      table {
        font-size: calc(1em * var(--text-scale));
      }

      table th,
      table td {
        font-size: calc(1em * var(--text-scale));
      }

      /* Form elements */
      input,
      textarea,
      select,
      button {
        font-size: calc(1em * var(--text-scale));
      }

      /* Ensure padding and margins scale proportionally */
      body.text-size-large {
        --spacing-scale: 1.1;
      }

      body.text-size-extra {
        --spacing-scale: 1.25;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
