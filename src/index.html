<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RxgovRegistry</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* Global Accessibility Styles */
      /* Default base font size */
      :root {
        --text-scale: 1;
      }

      body {
        font-size: calc(14px * var(--text-scale));
      }

      /* Ensure all elements inherit font size from body */
      * {
        font-size: inherit;
      }

      /* Large text size - 110% scaling */
      body.text-size-large {
        --text-scale: 1.1;
        font-size: calc(14px * var(--text-scale));
      }

      /* Extra text size - 125% scaling */
      body.text-size-extra {
        --text-scale: 1.25;
        font-size: calc(14px * var(--text-scale));
      }

      /* Override specific elements that have hardcoded sizes */
      body.text-size-large h1,
      body.text-size-large h2,
      body.text-size-large h3 {
        font-size: inherit;
      }

      body.text-size-extra h1,
      body.text-size-extra h2,
      body.text-size-extra h3 {
        font-size: inherit;
      }

      /* Table specific adjustments */
      table {
        font-size: inherit;
      }

      th,
      td {
        font-size: inherit;
      }

      /* Form elements */
      input,
      textarea,
      select,
      button {
        font-size: inherit;
      }

      /* Ensure headings scale proportionally */
      h1 {
        font-size: calc(2em * var(--text-scale, 1));
      }

      h2 {
        font-size: calc(1.75em * var(--text-scale, 1));
      }

      h3 {
        font-size: calc(1.5em * var(--text-scale, 1));
      }

      h4 {
        font-size: calc(1.25em * var(--text-scale, 1));
      }

      h5,
      h6 {
        font-size: calc(1em * var(--text-scale, 1));
      }

      /* Small elements */
      small {
        font-size: calc(0.875em * var(--text-scale, 1));
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
