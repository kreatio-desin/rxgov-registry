<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RxgovRegistry</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* Global Accessibility Styles */
      /* Default base font size */
      html,
      body {
        font-size: 14px;
      }

      /* Ensure all elements inherit font size by default */
      * {
        font-size: inherit !important;
      }

      /* Large text size - 110% scaling */
      html.text-size-large {
        font-size: 15.4px !important;
      }

      html.text-size-large * {
        font-size: inherit !important;
      }

      /* Extra text size - 125% scaling */
      html.text-size-extra {
        font-size: 17.5px !important;
      }

      html.text-size-extra * {
        font-size: inherit !important;
      }

      /* Headings scale proportionally with base font */
      h1 {
        font-size: 2em !important;
      }

      h2 {
        font-size: 1.75em !important;
      }

      h3 {
        font-size: 1.5em !important;
      }

      h4 {
        font-size: 1.25em !important;
      }

      h5,
      h6 {
        font-size: 1em !important;
      }

      small {
        font-size: 0.875em !important;
      }

      /* Tables inherit from parent */
      table {
        font-size: inherit !important;
      }

      th,
      td {
        font-size: inherit !important;
      }

      /* Form elements */
      input,
      textarea,
      select,
      button {
        font-size: inherit !important;
      }

      /* Icons inherit font size */
      i,
      svg {
        font-size: inherit !important;
      }

      /* Ensure badges and special elements inherit */
      .badge,
      .label,
      span {
        font-size: inherit !important;
      }

      /* Links */
      a {
        font-size: inherit !important;
      }

      /* Paragraphs and lists */
      p,
      li,
      div {
        font-size: inherit !important;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
